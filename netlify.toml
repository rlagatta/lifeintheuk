[build]
  publish = "."
  command = "echo static-and-functions"
  functions = "netlify/functions"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200
