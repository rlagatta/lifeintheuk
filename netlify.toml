[build]
  # Temporary safe config: publish repo root so CI never fails on missing app/index.html.
  # App shell with auth is deployed via Netlify upload until app/index.html is in git.
  publish = "."
  command = "mkdir -p app && cp -f index.html app/index.html && echo 'published root + app mirror'"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
